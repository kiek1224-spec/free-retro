<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Free Retro Player</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #ddd;
        font-family: system-ui;
      }
      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">게임 준비 중…</div>
    <div id="game"></div>
    <script type="module" src="player.js"></script>
  </body>
</html>
